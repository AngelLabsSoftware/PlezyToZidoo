name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I have searched the [existing issues](https://github.com/AngelLabsSoftware/PlezyToZidoo/issues) and confirmed this is not a duplicate
          required: true
        - label: I am running the latest version of PlezyToZidoo+
          required: true
        - label: I have redacted any personal information (IP addresses, tokens, passwords, file paths, server URLs) from this report
          required: true

  - type: input
    id: version
    attributes:
      label: PlezyToZidoo+ version
      description: Found in Settings (version top-right)
      placeholder: "2026.11.13"
    validations:
      required: true

  - type: input
    id: zidoo-model
    attributes:
      label: Zidoo model and firmware version
      placeholder: "Z9X 8K, firmware 1.1.x"
    validations:
      required: true

  - type: input
    id: plex-client
    attributes:
      label: Plex / Plezy client used
      placeholder: "Plezy / other"
    validations:
      required: true

  - type: input
    id: plex-server
    attributes:
      label: Plex Media Server version
      placeholder: "1.40.x"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Open Plezy
        2. Play a video with external player
        3. ...
    validations:
      required: true

  - type: textarea
    id: debug
    attributes:
      label: Debug output
      description: If applicable, enable Debug data in settings and paste the debug screen info here. Make sure to redact any personal information such as IP addresses, tokens, file paths, or usernames.
      render: text
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other relevant details (screenshots, logs, etc.)
    validations:
      required: false
