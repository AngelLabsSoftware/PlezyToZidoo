name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Durable Private Sideload cert (2026.11.3+). Never auto-generate a keystore in CI.
env:
  EXPECTED_CERT_SHA256: 7343b6b346fe270fcda466edd9490d56e7402c20020ef9b72b15c6993613740a

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Run Lint
      run: ./gradlew lintDebug

    - name: Require PP2Z signing secrets
      id: signing
      env:
        PP2Z_KEYSTORE_BASE64: ${{ secrets.PP2Z_KEYSTORE_BASE64 }}
        PP2Z_KEYSTORE_PASSWORD: ${{ secrets.PP2Z_KEYSTORE_PASSWORD }}
        PP2Z_KEY_ALIAS: ${{ secrets.PP2Z_KEY_ALIAS }}
        PP2Z_KEY_PASSWORD: ${{ secrets.PP2Z_KEY_PASSWORD }}
      run: |
        missing=0
        for name in PP2Z_KEYSTORE_BASE64 PP2Z_KEYSTORE_PASSWORD PP2Z_KEY_ALIAS PP2Z_KEY_PASSWORD; do
          if [ -z "${!name}" ]; then
            echo "::error::$name is missing. Configure durable sideload secrets; never generate a keystore in CI."
            missing=1
          fi
        done
        if [ "$missing" -ne 0 ]; then
          exit 1
        fi
        echo "Secrets present (values not logged)."

    - name: Decode signing keystore
      env:
        PP2Z_KEYSTORE_BASE64: ${{ secrets.PP2Z_KEYSTORE_BASE64 }}
      run: |
        # Decode only — never keytool -genkeypair in CI.
        echo "$PP2Z_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        test -s "$RUNNER_TEMP/release.jks"

    - name: Resolve APK filename from versionName
      id: ver
      run: |
        VERSION_NAME=$(sed -n 's/.*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1)
        if [ -z "$VERSION_NAME" ]; then
          echo "::error::Could not parse versionName from app/build.gradle"
          exit 1
        fi
        APK_NAME="PlezyPlexToZidoo-${VERSION_NAME}-armeabi-v7a-signed.apk"
        echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
        echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
        echo "APK will be named: $APK_NAME"

    - name: Build signed Release APK
      run: ./gradlew assembleRelease
      env:
        PP2Z_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
        PP2Z_KEYSTORE_PASSWORD: ${{ secrets.PP2Z_KEYSTORE_PASSWORD }}
        PP2Z_KEY_ALIAS: ${{ secrets.PP2Z_KEY_ALIAS }}
        PP2Z_KEY_PASSWORD: ${{ secrets.PP2Z_KEY_PASSWORD }}

    - name: Rename, verify signature and durable cert
      id: apk
      run: |
        set -euo pipefail
        APK_NAME="${{ steps.ver.outputs.apk_name }}"
        SRC=""
        if [ -f app/build/outputs/apk/release/app-release.apk ]; then
          SRC=app/build/outputs/apk/release/app-release.apk
        elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
          echo "::error::Release build produced an unsigned APK; refusing. Check PP2Z_* secrets."
          exit 1
        else
          echo "::error::No release APK found under app/build/outputs/apk/release"
          exit 1
        fi
        mv "$SRC" "$APK_NAME"

        APKSIGNER=""
        for c in \
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
          "$(ls -1d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)"; do
          if [ -n "$c" ] && [ -x "$c" ]; then APKSIGNER="$c"; break; fi
        done
        if [ -z "$APKSIGNER" ]; then
          echo "::error::apksigner not found under ANDROID_HOME=$ANDROID_HOME"
          exit 1
        fi

        "$APKSIGNER" verify --print-certs "$APK_NAME" | tee /tmp/apk-certs.txt
        CERT=$(awk '/SHA-256 digest:/{print tolower($NF); exit}' /tmp/apk-certs.txt | tr -d ':')
        echo "Signer cert SHA-256 (normalized): $CERT"
        if [ "$CERT" != "$EXPECTED_CERT_SHA256" ]; then
          echo "::error::Cert mismatch. Expected durable 11.3 cert $EXPECTED_CERT_SHA256, got $CERT"
          exit 1
        fi
        echo "cert_ok=true" >> "$GITHUB_OUTPUT"
        sha256sum "$APK_NAME" | tee "${APK_NAME}.sha256"

    - name: Upload signed APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.ver.outputs.apk_name }}
        path: |
          ${{ steps.ver.outputs.apk_name }}
          ${{ steps.ver.outputs.apk_name }}.sha256
        if-no-files-found: error

    - name: Upload Lint Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lint-report
        path: app/build/reports/lint-results-debug.html
        if-no-files-found: ignore
