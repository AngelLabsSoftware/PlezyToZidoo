name: Release APK

# Tag-only. Does not run on PRs/branch pushes.
# Requires PP2Z_KEYSTORE_* secrets (durable sideload key). Fails hard if missing.
# Never auto-generates a keystore. Do not push a tag unless you intend a GitHub Release.
on:
  push:
    tags:
      - 'v20*'

permissions:
  contents: write

env:
  EXPECTED_CERT_SHA256: 7343b6b346fe270fcda466edd9490d56e7402c20020ef9b72b15c6993613740a

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Run Unit Tests
      run: ./gradlew test

    - name: Require PP2Z signing secrets
      env:
        PP2Z_KEYSTORE_BASE64: ${{ secrets.PP2Z_KEYSTORE_BASE64 }}
        PP2Z_KEYSTORE_PASSWORD: ${{ secrets.PP2Z_KEYSTORE_PASSWORD }}
        PP2Z_KEY_ALIAS: ${{ secrets.PP2Z_KEY_ALIAS }}
        PP2Z_KEY_PASSWORD: ${{ secrets.PP2Z_KEY_PASSWORD }}
      run: |
        missing=0
        for name in PP2Z_KEYSTORE_BASE64 PP2Z_KEYSTORE_PASSWORD PP2Z_KEY_ALIAS PP2Z_KEY_PASSWORD; do
          if [ -z "${!name}" ]; then
            echo "::error::$name is missing. Configure durable sideload secrets; never generate a keystore in CI."
            missing=1
          fi
        done
        if [ "$missing" -ne 0 ]; then
          exit 1
        fi

    - name: Decode signing keystore
      env:
        PP2Z_KEYSTORE_BASE64: ${{ secrets.PP2Z_KEYSTORE_BASE64 }}
      run: |
        # Decode only — never keytool -genkeypair in CI.
        echo "$PP2Z_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        test -s "$RUNNER_TEMP/release.jks"

    - name: Resolve APK filename from versionName
      id: ver
      run: |
        VERSION_NAME=$(sed -n 's/.*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1)
        if [ -z "$VERSION_NAME" ]; then
          echo "::error::Could not parse versionName from app/build.gradle"
          exit 1
        fi
        APK_NAME="PlezyPlexToZidoo-${VERSION_NAME}-armeabi-v7a-signed.apk"
        echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
        echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

    - name: Build Release APK
      run: ./gradlew assembleRelease
      env:
        PP2Z_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
        PP2Z_KEYSTORE_PASSWORD: ${{ secrets.PP2Z_KEYSTORE_PASSWORD }}
        PP2Z_KEY_ALIAS: ${{ secrets.PP2Z_KEY_ALIAS }}
        PP2Z_KEY_PASSWORD: ${{ secrets.PP2Z_KEY_PASSWORD }}

    - name: Rename and verify signed APK + durable cert
      run: |
        set -euo pipefail
        APK_NAME="${{ steps.ver.outputs.apk_name }}"
        if [ -f app/build/outputs/apk/release/app-release.apk ]; then
          mv app/build/outputs/apk/release/app-release.apk "$APK_NAME"
        elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
          echo "::error::Release build produced an unsigned APK; refusing to publish. Check the PP2Z_KEYSTORE_* secrets."
          exit 1
        else
          echo "::error::No release APK found in app/build/outputs/apk/release"
          exit 1
        fi

        APKSIGNER=""
        for c in \
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
          "$(ls -1d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)"; do
          if [ -n "$c" ] && [ -x "$c" ]; then APKSIGNER="$c"; break; fi
        done
        if [ -z "$APKSIGNER" ]; then
          echo "::error::apksigner not found"
          exit 1
        fi

        "$APKSIGNER" verify --print-certs "$APK_NAME" | tee /tmp/apk-certs.txt
        CERT=$(awk '/SHA-256 digest:/{print tolower($NF); exit}' /tmp/apk-certs.txt | tr -d ':')
        if [ "$CERT" != "$EXPECTED_CERT_SHA256" ]; then
          echo "::error::Cert mismatch. Expected $EXPECTED_CERT_SHA256, got $CERT"
          exit 1
        fi
        sha256sum "$APK_NAME" | tee "${APK_NAME}.sha256"

    - name: Check for release notes file
      id: notes
      run: |
        if [ -f RELEASE_NOTES.md ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Create GitHub Release (with notes file)
      if: steps.notes.outputs.exists == 'true'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ steps.ver.outputs.apk_name }}
          ${{ steps.ver.outputs.apk_name }}.sha256
        generate_release_notes: true
        body_path: RELEASE_NOTES.md
        prerelease: ${{ contains(github.ref_name, '-beta') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create GitHub Release (auto notes only)
      if: steps.notes.outputs.exists == 'false'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ steps.ver.outputs.apk_name }}
          ${{ steps.ver.outputs.apk_name }}.sha256
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-beta') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
