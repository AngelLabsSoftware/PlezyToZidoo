name: Release APK

# Tag-only. Does not run on PRs/branch pushes.
# When PP2Z_KEYSTORE_* secrets are missing, exit green after tests and skip
# signed publish so manual GitHub Releases (sideload APK) stay valid.
on:
  push:
    tags:
      - 'v20*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Run Unit Tests
      run: ./gradlew test

    - name: Check signing secrets
      id: signing
      env:
        PP2Z_KEYSTORE_BASE64: ${{ secrets.PP2Z_KEYSTORE_BASE64 }}
        PP2Z_KEYSTORE_PASSWORD: ${{ secrets.PP2Z_KEYSTORE_PASSWORD }}
        PP2Z_KEY_ALIAS: ${{ secrets.PP2Z_KEY_ALIAS }}
        PP2Z_KEY_PASSWORD: ${{ secrets.PP2Z_KEY_PASSWORD }}
      run: |
        if [ -n "$PP2Z_KEYSTORE_BASE64" ] \
          && [ -n "$PP2Z_KEYSTORE_PASSWORD" ] \
          && [ -n "$PP2Z_KEY_ALIAS" ] \
          && [ -n "$PP2Z_KEY_PASSWORD" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::notice::PP2Z_KEYSTORE_* secrets are not configured. Skipping CI signed release publish; keep using the manually uploaded GitHub Release APK."
        fi

    - name: Decode signing keystore
      if: steps.signing.outputs.available == 'true'
      env:
        PP2Z_KEYSTORE_BASE64: ${{ secrets.PP2Z_KEYSTORE_BASE64 }}
      run: echo "$PP2Z_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

    - name: Build Release APK
      if: steps.signing.outputs.available == 'true'
      run: ./gradlew assembleRelease
      env:
        PP2Z_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
        PP2Z_KEYSTORE_PASSWORD: ${{ secrets.PP2Z_KEYSTORE_PASSWORD }}
        PP2Z_KEY_ALIAS: ${{ secrets.PP2Z_KEY_ALIAS }}
        PP2Z_KEY_PASSWORD: ${{ secrets.PP2Z_KEY_PASSWORD }}

    - name: Verify signed APK and rename
      if: steps.signing.outputs.available == 'true'
      run: |
        if [ -f app/build/outputs/apk/release/app-release.apk ]; then
          mv app/build/outputs/apk/release/app-release.apk PlezyPlexToZidoo.apk
        elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
          echo "::error::Release build produced an unsigned APK; refusing to publish. Check the PP2Z_KEYSTORE_* secrets."
          exit 1
        else
          echo "::error::No release APK found in app/build/outputs/apk/release"
          exit 1
        fi

    - name: Verify APK signature
      if: steps.signing.outputs.available == 'true'
      run: $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs PlezyPlexToZidoo.apk | grep -i cert

    - name: Check for release notes file
      if: steps.signing.outputs.available == 'true'
      id: notes
      run: |
        if [ -f RELEASE_NOTES.md ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Create GitHub Release (with notes file)
      if: steps.signing.outputs.available == 'true' && steps.notes.outputs.exists == 'true'
      uses: softprops/action-gh-release@v2
      with:
        files: PlezyPlexToZidoo.apk
        generate_release_notes: true
        body_path: RELEASE_NOTES.md
        prerelease: ${{ contains(github.ref_name, '-beta') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create GitHub Release (auto notes only)
      if: steps.signing.outputs.available == 'true' && steps.notes.outputs.exists == 'false'
      uses: softprops/action-gh-release@v2
      with:
        files: PlezyPlexToZidoo.apk
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-beta') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Skipped CI release publish
      if: steps.signing.outputs.available != 'true'
      run: |
        echo "CI release publish skipped (missing PP2Z_KEYSTORE_*)."
        echo "Manual GitHub Release assets are unaffected."
