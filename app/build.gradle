import java.util.Properties

plugins {
    id 'com.android.application'
}

android {
    namespace "com.plezyplextozidoo"
    compileSdk 34

    defaultConfig {
        applicationId "com.plezyplextozidoo"
        minSdkVersion 28
        targetSdkVersion 28
        versionCode 20261127
        versionName "2026.11.6"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Zidoo Z9X (and similar) run a 32-bit OS — ship armeabi-v7a only.
        ndk {
            abiFilters "armeabi-v7a"
        }
    }

    buildFeatures {
        buildConfig true
    }

    applicationVariants.all { variant ->
        variant.resValue "string", "versionName", variant.versionName
    }

    // Signing priority:
    // 1) CI / release secrets via PP2Z_* env vars
    // 2) Project-local private sideload keystore + gitignored keystore/keystore.properties
    // 3) Android debug keystore (local installs only)
    // The local keystore is a PRIVATE TEST / SIDELOAD key — not for Play Store.
    // Never hardcode store/key passwords in this file.
    signingConfigs {
        release {
            def ksPath = System.getenv("PP2Z_KEYSTORE_PATH")
            def localKs = rootProject.file("keystore/pp2z-private-release.jks")
            def localPropsFile = rootProject.file("keystore/keystore.properties")
            def debugKs = file("${System.getProperty('user.home')}/.android/debug.keystore")

            // Enable JAR + APK Signature Scheme v2 for sideload friendliness on OEM boxes.
            enableV1Signing true
            enableV2Signing true

            // Set by CI assembleRelease only — refuses Android debug fallback for release APKs.
            def requireReleaseSigning =
                    "true".equalsIgnoreCase(System.getenv("PP2Z_REQUIRE_RELEASE_SIGNING"))

            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("PP2Z_KEYSTORE_PASSWORD")
                keyAlias System.getenv("PP2Z_KEY_ALIAS")
                keyPassword System.getenv("PP2Z_KEY_PASSWORD")
            } else if (localKs.exists() && localPropsFile.exists()) {
                def localProps = new Properties()
                localPropsFile.withInputStream { localProps.load(it) }
                def storePass = localProps.getProperty("storePassword")
                def keyPass = localProps.getProperty("keyPassword")
                def alias = localProps.getProperty("keyAlias", "pp2z")
                if (storePass && keyPass) {
                    storeFile localKs
                    storePassword storePass
                    keyAlias alias
                    keyPassword keyPass
                } else {
                    throw new GradleException(
                            "keystore/keystore.properties is missing storePassword or keyPassword. See keystore/README.md")
                }
            } else if (requireReleaseSigning) {
                // CI / release artifacts must use PP2Z_* (or local durable JKS) — never debug.
                throw new GradleException(
                        "Release signing required but PP2Z_KEYSTORE_PATH / local keystore missing. "
                                + "Do not generate a keystore in CI; configure PP2Z_* secrets.")
            } else if (debugKs.exists()) {
                storeFile debugKs
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Always attach a signing config so assembleRelease yields an installable APK.
            // If no keystore is available, Gradle will fail clearly rather than emit unsigned.
            signingConfig signingConfigs.release
        }
    }
    lint {
        disable 'ExpiredTargetSdkVersion'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.2.1'
    implementation 'androidx.preference:preference:1.1.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.security:security-crypto:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'jp.wasabeef:glide-transformations:4.3.0'
}
